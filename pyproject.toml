[project]
name = "kaitian"
version = "0.1.0"
description = "A Python toolkit for rapid machine learning prototyping across diverse real-world scenarios."
readme = "README.md"
authors = [
    { name = "AshSwing", email = "ashswing@email.cn" }
]
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "loguru>=0.8.0",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "polars>=2.2.0",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
kaitian = "kaitian:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
